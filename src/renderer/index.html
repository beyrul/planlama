<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PlanlaMa</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar" aria-label="Plan basliklari">
        <div class="brand">
          <div class="brand-mark">P</div>
          <div>
            <h1>PlanlaMa</h1>
            <p>Gorsel plan panosu</p>
          </div>
        </div>

        <button class="primary-action" id="add-section" type="button">
          <span aria-hidden="true">+</span>
          Baslik
        </button>

        <nav class="section-list" id="section-list"></nav>
      </aside>

      <main class="workspace">
        <header class="topbar">
          <div>
            <p class="eyebrow">Aktif alan</p>
            <h2 id="active-title">Bugun</h2>
          </div>
          <div class="toolbar" role="toolbar" aria-label="Pano araclari">
            <button id="focus-mode" class="icon-button" type="button" title="Odak modu">◎</button>
            <button id="add-board" class="ghost-button" type="button">
              <span aria-hidden="true">+</span>
              Pano
            </button>
            <button id="add-note" class="accent-button" type="button">
              <span aria-hidden="true">+</span>
              Post-it
            </button>
          </div>
        </header>

        <section class="focus-strip" id="focus-strip"></section>

        <section class="corkboard" id="corkboard" aria-label="Mantar pano"></section>
      </main>
    </div>

    <dialog id="note-dialog">
      <form method="dialog" class="dialog-form">
        <h2 id="dialog-title">Kart</h2>
        <input id="note-title" maxlength="48" placeholder="Kisa baslik" />
        <input id="note-type" type="hidden" value="postit" />
        <div class="field-row">
          <label>
            Boyut
            <select id="note-size">
              <option value="small">Kucuk</option>
              <option value="medium">Orta</option>
              <option value="large">Buyuk</option>
            </select>
          </label>
          <div class="component-menu" id="component-menu" aria-label="Component ekle">
            <button id="add-text-component" class="ghost-button" type="button" title="Yazi ekle">T</button>
            <button id="add-todo-component" class="ghost-button" type="button" title="To-do ekle">☑</button>
            <button id="add-image-component" class="ghost-button" type="button" title="Foto ekle">▧</button>
          </div>
        </div>
        <div class="component-editor" id="component-editor"></div>
        <div class="field-row">
          <label>
            Durum
            <select id="note-status">
              <option value="next">Sirada</option>
              <option value="doing">Simdi</option>
              <option value="waiting">Bekliyor</option>
              <option value="done">Bitti</option>
            </select>
          </label>
          <label>
            Enerji
            <select id="note-energy">
              <option value="low">Dusuk</option>
              <option value="medium">Orta</option>
              <option value="high">Yuksek</option>
            </select>
          </label>
        </div>
        <div class="swatches" id="color-swatches" aria-label="Kart rengi"></div>
        <menu class="dialog-actions">
          <button id="delete-note" class="ghost-danger" type="button">Sil</button>
          <button value="cancel" type="submit">Vazgec</button>
          <button id="save-note" class="accent-button" value="default" type="submit">Kaydet</button>
        </menu>
      </form>
    </dialog>

    <dialog id="section-dialog">
      <form method="dialog" class="dialog-form compact-dialog">
        <h2>Yeni baslik</h2>
        <input id="section-title" maxlength="32" placeholder="Baslik adi" />
        <menu class="dialog-actions">
          <button value="cancel" type="submit">Vazgec</button>
          <button id="save-section" class="accent-button" value="default" type="submit">Ekle</button>
        </menu>
      </form>
    </dialog>

    <dialog id="image-preview-dialog" class="image-preview-dialog">
      <form method="dialog" class="image-preview-frame">
        <button class="image-preview-close" value="cancel" type="submit">×</button>
        <img id="image-preview" alt="Foto onizleme" />
      </form>
    </dialog>

    <script src="./app.js"></script>
  </body>
</html>
